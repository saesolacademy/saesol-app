# 새솔학원 관리 앱 설정 파일
# 아래 database_id 한 줄만 원장님이 직접 바꾸시면 됩니다.

name = "saesol-app"
main = "src/index.js"
compatibility_date = "2025-09-01"

# 화면 파일(public 폴더)을 함께 올립니다.
[assets]
directory = "./public"

# 데이터베이스(D1) 연결
[[d1_databases]]
binding = "DB"
database_name = "saesol-db"
database_id = "a5edc1af-5e1e-44ee-b92b-d4be9fbe0567"
